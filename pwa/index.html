<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Notes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#1f5f5b">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Field Notes</title>
<style>
:root{--bg:#eef1f1;--card:#fff;--ink:#16211f;--mute:#5d6b69;--line:#d3dbda;--accent:#1f5f5b;--accent-ink:#fff;--danger:#a3331f;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111716;--card:#1a2221;--ink:#e8efee;--mute:#93a3a1;--line:#2d3938;--accent:#5fb8b0;--accent-ink:#0c1514;--danger:#ff8f7a}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:17px/1.45 -apple-system,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:26px;margin:8px 0 18px;letter-spacing:-.02em}
h2{font-size:18px;margin:32px 0 10px}
form,.entry{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
label{display:block;font-size:14px;color:var(--mute);margin:0 0 4px}
.f{margin-bottom:14px}
input,textarea{width:100%;font:inherit;font-size:17px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:12px 16px;background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.alt{background:transparent;color:var(--accent);border:1px solid var(--accent)}
button.del{background:none;color:var(--danger);padding:4px 0;font-weight:500;font-size:15px}
form button{width:100%}
.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}
.entry{margin-bottom:10px}
.entry dl{margin:0}.entry dt{font-size:13px;color:var(--mute)}.entry dd{margin:0 0 8px;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px}
.empty{color:var(--mute);padding:8px 2px}
#msg{min-height:22px;color:var(--mute);font-size:14px;margin-top:10px}
</style>
</head>
<body>
<main>
<h1>Field Notes</h1>
<form id="form" autocomplete="off"></form>

<h2>Saved entries (<span id="count">0</span>)</h2>
<div class="row" style="margin-bottom:12px">
  <button class="alt" id="shareJson">Send as JSON</button>
  <button class="alt" id="shareCsv">Send as CSV</button>
</div>
<div id="msg" role="status"></div>
<div id="list"></div>
</main>

<script>

const FIELDS = [
  { key: "title",  label: "Title",  type: "text" },
  { key: "name",   label: "Name",   type: "text" },
  { key: "date",   label: "Date",   type: "date" },
  { key: "notes",  label: "Notes",  type: "textarea" }
];

const STORE = "entries-v1";
const $ = s => document.querySelector(s);
let entries = [];

function load(){ try { entries = JSON.parse(localStorage.getItem(STORE) || "[]"); } catch { entries = []; } }
function save(){
  try { localStorage.setItem(STORE, JSON.stringify(entries)); return true; }
  catch { say("Could not save: storage is full or blocked."); return false; }
}
function say(t){ $("#msg").textContent = t; }

function buildForm(){
  const f = $("#form");
  FIELDS.forEach(fl => {
    const d = document.createElement("div"); d.className = "f";
    const l = document.createElement("label"); l.htmlFor = "f_" + fl.key; l.textContent = fl.label;
    const i = document.createElement(fl.type === "textarea" ? "textarea" : "input");
    if (fl.type !== "textarea") i.type = fl.type;
    i.id = "f_" + fl.key; i.name = fl.key;
    d.append(l, i); f.append(d);
  });
  const b = document.createElement("button"); b.type = "submit"; b.textContent = "Save entry";
  f.append(b);
  f.addEventListener("submit", e => {
    e.preventDefault();
    const rec = { id: Date.now().toString(36), created: new Date().toISOString() };
    FIELDS.forEach(fl => rec[fl.key] = f.elements[fl.key].value.trim());
    if (FIELDS.every(fl => !rec[fl.key])) { say("Fill in at least one field."); return; }
    entries.unshift(rec);
    if (save()) { f.reset(); say("Entry saved."); render(); }
    else entries.shift();
  });
}

function render(){
  $("#count").textContent = entries.length;
  const list = $("#list"); list.textContent = "";
  if (!entries.length){ list.innerHTML = '<p class="empty">No entries yet. Fill in the form above and tap Save entry.</p>'; return; }
  entries.forEach(en => {
    const c = document.createElement("div"); c.className = "entry";
    const dl = document.createElement("dl");
    FIELDS.forEach(fl => {
      if (!en[fl.key]) return;
      const dt = document.createElement("dt"); dt.textContent = fl.label;
      const dd = document.createElement("dd"); dd.textContent = en[fl.key];
      dl.append(dt, dd);
    });
    const m = document.createElement("div"); m.className = "meta";
    const s = document.createElement("span"); s.textContent = new Date(en.created).toLocaleString();
    const x = document.createElement("button"); x.className = "del"; x.textContent = "Delete";
    x.onclick = () => { if (confirm("Delete this entry?")){ entries = entries.filter(e => e.id !== en.id); save(); render(); } };
    m.append(s, x); c.append(dl, m); list.append(c);
  });
}

function csv(){
  const cols = ["created", ...FIELDS.map(f => f.key)];
  const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
  return "\ufeff" + [cols.join(","), ...entries.map(e => cols.map(c => q(e[c])).join(","))].join("\r\n");
}

async function send(kind){
  if (!entries.length){ say("Nothing to send yet."); return; }
  const stamp = new Date().toISOString().slice(0,10);
  const isJson = kind === "json";
  const file = new File(
    [isJson ? JSON.stringify(entries, null, 2) : csv()],
    `notes-${stamp}.${isJson ? "json" : "csv"}`,
    { type: isJson ? "application/json" : "text/csv" }
  );
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      await navigator.share({ files: [file], title: "Field Notes export" });
      say("Shared."); return;
    }
  } catch (err) { if (err.name === "AbortError"){ say("Sharing cancelled."); return; } }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(file); a.download = file.name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  say("Sharing is not available here, so the file was downloaded instead.");
}

$("#shareJson").onclick = () => send("json");
$("#shareCsv").onclick = () => send("csv");

load(); buildForm(); render();
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
</body>
</html>
